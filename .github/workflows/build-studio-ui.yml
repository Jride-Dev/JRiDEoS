name: build-studio-ui

on:
  push:
    branches: [main]
    paths:
      - 'studio-ui/**'
      - 'build-studio-ui.sh'
      - '.github/workflows/build-studio-ui.yml'
    tags: ['studio-ui-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        working-directory: studio-ui
    steps:
      - uses: actions/checkout@v4

      - name: Install live-build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap cdebootstrap \
            squashfs-tools xorriso isolinux syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Build Studio-UI ISO
        shell: bash
        run: |
          set -o pipefail
          sh auto/config
          lb build 2>&1 | tee build.log
          echo "--- build outputs ---"
          ls -lh
          ls -lh *.iso || (echo "E: no ISO produced, build failed"; exit 1)

      - name: Upload Studio-UI ISO
        uses: actions/upload-artifact@v4
        with:
          name: jrideos-studio-ui-iso
          path: |
            studio-ui/*.iso
            studio-ui/*.contents
            studio-ui/*.packages
            studio-ui/build.log
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/studio-ui-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jrideos-studio-ui-iso
          path: dist

      - name: List dist
        run: ls -lhR dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/*.contents
            dist/*.packages
            dist/build.log
