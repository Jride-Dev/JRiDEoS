# JRiDEoS Studio-UI sysctl — DAW + gaming, Tiger Lake
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Full RT sched bandwidth for DSP threads (heavy plugin chains)
kernel.sched_rt_runtime_us = 950000

# Sample libraries + DAW projects with thousands of files
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# Legacy MIDI timing
dev.hpet.max-user-freq = 3072

# Proton/Steam require unprivileged userns
kernel.unprivileged_userns_clone = 1

# Hardening baseline (browsing-spin subset, kept game-compatible)
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 2
kernel.unprivileged_bpf_disabled = 2
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
