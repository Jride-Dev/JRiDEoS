# rtirq: prioritize Tiger Lake audio + GPU IRQ threads for xrun-free DSP.
# USB class-compliant interfaces first (guitar amps, modelers, FX units),
# then onboard SOF/HDA, then i915/xhci/nvme.
RTIRQ_NAME_LIST="snd_usb_audio snd_usb_usx2y snd_sof_pci_intel_tgl snd_hda_intel i915 xhci_hcd nvme"
RTIRQ_PRIO_HIGH=90
RTIRQ_PRIO_DECR=5
RTIRQ_RESET_ALL=0
RTIRQ_NON_THREADED="rtc snd"
