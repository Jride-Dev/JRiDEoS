# JRiDEoS Studio sysctl — DAW + gaming on Tiger Lake
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Full RT sched bandwidth for DSP threads
kernel.sched_rt_runtime_us = 950000

# Plugin/file watching for large sample libraries + DAW projects
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# HPET access for legacy MIDI timing
dev.hpet.max-user-freq = 3072

# Proton/Steam need unprivileged userns (also set in gaming hook)
kernel.unprivileged_userns_clone = 1

# No forwarding on a laptop
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
